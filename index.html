<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Benim Sitem</title>
  <meta name="description" content="Kişisel web sitem">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --silver: #e0e0e0;
      --accent: #ff3c00;
      --grain-opacity: 0.15;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; background: var(--bg); }

    .halide-body {
      background-color: var(--bg);
      color: var(--silver);
      font-family: 'Syncopate', sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .halide-grain {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
      opacity: var(--grain-opacity);
    }

    .viewport {
      perspective: 2000px;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    .canvas-3d {
      position: relative;
      width: 800px; height: 500px;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .layer {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(224, 224, 224, 0.1);
      background-size: cover;
      background-position: center;
      transition: transform 0.5s ease;
    }

    /* Görselleri kendi fotoğraflarınla değiştirebilirsin */
    .layer-1 { background-image: url('https://cdn.21st.dev/assets/mirror/e5/e5ef2d30267a4e7f81bc0a61283385f0e59c348d8e69a017f1a87b5323fd8abc.jpg'); filter: grayscale(1) contrast(1.2) brightness(0.5); }
    .layer-2 { background-image: url('https://cdn.21st.dev/assets/mirror/80/80f63f867cb6db0e217d01b6b23e0d623b38d7791dc6a5c6b647744541e4f71d.jpg'); filter: grayscale(1) contrast(1.1) brightness(0.7); opacity: 0.6; mix-blend-mode: screen; }
    .layer-3 { background-image: url('https://cdn.21st.dev/assets/mirror/59/597353f775e864ce7ab427b39deecf97b8de0560e30cb3749da756c896a17023.jpg'); filter: grayscale(1) contrast(1.3) brightness(0.8); opacity: 0.4; mix-blend-mode: overlay; }

    .contours {
      position: absolute;
      width: 200%; height: 200%;
      top: -50%; left: -50%;
      background-image: repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 40px, rgba(255,255,255,0.05) 41px, transparent 42px);
      transform: translateZ(120px);
      pointer-events: none;
    }

    .interface-grid {
      position: fixed;
      inset: 0;
      padding: 4rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr auto;
      z-index: 10;
      pointer-events: none;
    }

    .brand { font-weight: 700; }

    .meta-top {
      text-align: right;
      font-family: monospace;
      color: var(--accent);
      font-size: 0.7rem;
    }

    .hero-title {
      grid-column: 1 / -1;
      align-self: center;
      margin: 0;
      font-size: clamp(3rem, 10vw, 10rem);
      line-height: 0.85;
      letter-spacing: -0.04em;
      mix-blend-mode: difference;
    }

    .interface-bottom {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
    }

    .meta-bottom { font-family: monospace; font-size: 0.75rem; }
    .meta-bottom p { margin: 0.25rem 0; }

    .cta-button {
      pointer-events: auto;
      background: var(--silver);
      color: var(--bg);
      padding: 1rem 2rem;
      text-decoration: none;
      font-weight: 700;
      clip-path: polygon(0 0, 100% 0, 100% 70%, 85% 100%, 0 100%);
      transition: 0.3s;
    }

    .cta-button:hover { background: var(--accent); transform: translateY(-5px); }
    .cta-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    .scroll-hint {
      position: absolute;
      bottom: 2rem; left: 50%;
      width: 1px; height: 60px;
      background: linear-gradient(to bottom, var(--silver), transparent);
      animation: flow 2s infinite ease-in-out;
    }

    @keyframes flow {
      0%, 100% { transform: scaleY(0); transform-origin: top; }
      50% { transform: scaleY(1); transform-origin: top; }
      51% { transform: scaleY(1); transform-origin: bottom; }
    }

    @media (max-width: 700px) {
      .interface-grid { padding: 1.5rem; }
      .canvas-3d { width: 92vw; height: 58vw; }
      .interface-bottom { flex-direction: column; align-items: flex-start; }
      .scroll-hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-hint { animation: none; }
      .canvas-3d, .layer, .cta-button { transition: none; }
    }
  </style>
</head>
<body>
  <div class="halide-body">
    <!-- Grain filtresi -->
    <svg style="position:absolute;width:0;height:0" aria-hidden="true">
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3"></feTurbulence>
        <feColorMatrix type="saturate" values="0"></feColorMatrix>
      </filter>
    </svg>
    <div class="halide-grain" style="filter:url(#grain)"></div>

    <!-- Metinleri kendine göre değiştir -->
    <div class="interface-grid">
      <div class="brand">ADIN_SOYADIN</div>
      <div class="meta-top">
        <div>İZMİR, TÜRKİYE</div>
        <div>PORTFOLYO 2026</div>
      </div>

      <h1 class="hero-title">SILVER<br>SULPHIDE</h1>

      <div class="interface-bottom">
        <div class="meta-bottom">
          <p>[ ARŞİV 2026 ]</p>
          <p>KISA BİR AÇIKLAMA BURAYA</p>
        </div>
        <a href="#" class="cta-button">KEŞFET</a>
      </div>
    </div>

    <div class="viewport">
      <div class="canvas-3d" id="canvas">
        <div class="layer layer-1"></div>
        <div class="layer layer-2"></div>
        <div class="layer layer-3"></div>
        <div class="contours"></div>
      </div>
    </div>

    <div class="scroll-hint"></div>
  </div>

  <script>
    (function () {
      var canvas = document.getElementById('canvas');
      var layers = canvas.querySelectorAll('.layer');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Giriş animasyonu
      if (reduce) {
        canvas.style.transform = 'rotateX(55deg) rotateZ(-25deg)';
        return;
      }
      canvas.style.opacity = '0';
      canvas.style.transform = 'rotateX(90deg) rotateZ(0deg) scale(0.8)';
      setTimeout(function () {
        canvas.style.transition = 'all 2.5s cubic-bezier(0.16, 1, 0.3, 1)';
        canvas.style.opacity = '1';
        canvas.style.transform = 'rotateX(55deg) rotateZ(-25deg) scale(1)';
      }, 300);

      // Fare paralaksı
      window.addEventListener('mousemove', function (e) {
        var x = (window.innerWidth / 2 - e.pageX) / 25;
        var y = (window.innerHeight / 2 - e.pageY) / 25;
        canvas.style.transform = 'rotateX(' + (55 + y / 2) + 'deg) rotateZ(' + (-25 + x / 2) + 'deg)';
        layers.forEach(function (layer, i) {
          var depth = (i + 1) * 15;
          layer.style.transform = 'translateZ(' + depth + 'px) translate(' + (x * (i + 1) * 0.2) + 'px, ' + (y * (i + 1) * 0.2) + 'px)';
        });
      });
    })();
  </script>
</body>
</html>
